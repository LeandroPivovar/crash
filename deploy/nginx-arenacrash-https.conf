# Etapa 2: HTTPS (certificado em /etc/letsencrypt/live/arenacrash.com/).
server {
    listen 80;
    server_name arenacrash.com www.arenacrash.com;
    location /.well-known/acme-challenge/ { root /opt/arena/acme; }
    location / { return 301 https://arenacrash.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.arenacrash.com;
    ssl_certificate /etc/letsencrypt/live/arenacrash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arenacrash.com/privkey.pem;
    return 301 https://arenacrash.com$request_uri;
}
server {
    listen 443 ssl;
    server_name arenacrash.com;
    ssl_certificate /etc/letsencrypt/live/arenacrash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arenacrash.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_set_header Host $host;
        # o próprio nginx define o IP (o que o cliente mandar em X-Forwarded-For é descartado)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
        proxy_read_timeout 90s;
    }
    # compressão (o level.bin cai de 23 MB para ~5 MB). Lista própria: aqui ela substitui a do nginx.conf
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/octet-stream application/json application/javascript text/javascript text/css image/svg+xml text/plain;
}
