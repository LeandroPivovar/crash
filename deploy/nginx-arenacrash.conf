# nginx (aaPanel): /www/server/panel/vhost/nginx/arenacrash.com.conf
# Etapa 1 (sem certificado): só HTTP, com a pasta do Let's Encrypt. instalar.sh troca para a etapa 2 quando o
# certificado existir.
server {
    listen 80;
    server_name arenacrash.com www.arenacrash.com;
    location /.well-known/acme-challenge/ { root /opt/arena/acme; }
    location / {
        proxy_pass http://127.0.0.1:3150;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
}
